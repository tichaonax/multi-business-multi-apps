<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Connecting…</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
  }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 4px solid #334155; border-top-color: #2563eb;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { font-size: 15px; color: #94a3b8; }
  .label b { color: #e2e8f0; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="label">Connecting to <b id="serverLabel">server</b>…</div>
  <script>
    // Label comes in as a loadFile() query param (see main.js's openServer) —
    // this page is otherwise fully static, so no preload/IPC bridge needed.
    const label = new URLSearchParams(location.search).get('label')
    if (label) document.getElementById('serverLabel').textContent = label
  </script>
</body>
</html>
